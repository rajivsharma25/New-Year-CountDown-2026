<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Year 2026 CountDown</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>New Year <span style="font-size: 3rem; color: #9A3F3F; font-weight: 600">2026</span> CountDown</h1>
      <div id="countdown">
        <div>
          <span id="days">00</span>
          <span class="timer-details">Days</span>
        </div>
        <div>
            <span id="hours">00</span>
            <span class="timer-details">Hours</span>
        </div>
        <div>
            <span id="minutes">00</span>
            <span class="timer-details">Minutes</span>
        </div>
        <div>
            <span id="seconds">00</span>
            <span class="timer-details">Seconds</span>
        </div>
      </div>
      <h2>Progress:</h2>
      <div class="progress-details">
        <span>Start: 1 Jan 2025</span>
        <span>End: 31 Dec 2025</span>
      </div>
      <div class="progress-container">
        <div id="progress-bar"></div>
      </div>
    </div>
    <script src="/script.js"></script>
  </body>
</html>
